<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz de Ciencias</title>
    <link rel="stylesheet" href="style2.css">
</head>

<body>

    <div id="countdown-screen" class="countdown-screen" hidden>
    <h1>PREPÁRATE</h1>
    <p id="countdown-number">3</p>
</div>

    <div class="app">
        <h1>Cuestionario de Ciencias</h1>

        <div class="quiz">

            <div class="timer">
                Tiempo restante: <span id="timer">15</span> segundos
            </div>

            <h2 id="question">Question goes here</h2>

            <img
                id="question-image"
                class="question-image"
                src=""
                alt=""
                style="display: none;"
            >

            <div id="answer-buttons" class="answer-grid"></div>

            <div id="leaderboard" hidden></div>

            <button id="next-btn">Next</button>

            <button id="home-btn" onclick="window.location.href='index.html'">
                Volver al inicio
            </button>

        </div>
    </div>

    <img
        src="imagenes/personaje.png"
        alt="Ayudante del cuestionario"
        class="quiz-character"
        id="presentador"
    >

    <script src="script.js"></script>

</body>
</html>
